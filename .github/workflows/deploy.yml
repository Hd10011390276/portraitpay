name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Configure git
        run: |
          git config --global user.email "128709612+Hd10011390276@users.noreply.github.com"
          git config --global user.name "Hd10011390276"

      - name: Deploy to Vercel
        run: |
          # Update PINATA_JWT in Vercel project environment (new JWT with pinning scope)
          # This runs on every deploy to ensure the correct JWT is set
          npx vercel project env add PINATA_JWT "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..lUqsHoffqUCF_ZYheU8ICv_G7Y81IPMLdS5kRyXWV3U" production --token ${{ secrets.VERCEL_TOKEN_2 }} 2>/dev/null || true
          npx vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN_2 }}
