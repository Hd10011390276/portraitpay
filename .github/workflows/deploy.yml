name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Configure git
        run: |
          git config --global user.email "hangdivision@gmail.com"
          git config --global user.name "Hang"

      - name: Deploy via Vercel REST API
        id: deploy
        run: |
          SHA=$(git rev-parse HEAD)
          RESPONSE=$(curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"portraitpay\",
              \"gitSource\": {
                \"type\": \"github\",
                \"repo\": \"Hd10011390276/portraitpay\",
                \"ref\": \"main\",
                \"sha\": \"$SHA\"
              },
              \"buildCommand\": \"npm run build\",
              \"outputDirectory\": \".next\",
              \"runtime\": \"nodejs20\",
              \"env\": {
                \"DATABASE_URL\": \"$DATABASE_URL\",
                \"DIRECT_URL\": \"$DIRECT_URL\"
              }
            }")
          echo "Deployment response: $RESPONSE"
          DEPLOY_URL=$(echo "$RESPONSE" | grep -o '"url":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "$DEPLOY_URL" ]; then
            echo "✅ Deployment initiated: https://$DEPLOY_URL"
          else
            echo "❌ Deployment failed"
            echo "$RESPONSE"
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_2 }}
