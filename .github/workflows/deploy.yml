name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Configure git
        run: |
          git config --global user.email "hangdivision@gmail.com"
          git config --global user.name "Hang"

      - name: Deploy to Vercel
        run: |
          set -e
          # Try CLI first
          if vercel --prod --yes --token $VERCEL_TOKEN; then
            echo "CLI deploy succeeded"
          else
            CLI_EXIT=$?
            LAST_LOG=$(vercel --prod --yes --token $VERCEL_TOKEN 2>&1 | tail -1)
            if echo "$LAST_LOG" | grep -q "api-deployments-free-per-day"; then
              echo "Vercel CLI rate limited — falling back to REST API"
              # Fall back to Vercel REST API
              curl -s -X POST "https://api.vercel.com/v13/deployments" \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{
                  "name": "portraitpay",
                  "gitSource": {
                    "type": "github",
                    "repo": "Hd10011390276/portraitpay",
                    "ref": "main",
                    "sha": "'$(git rev-parse HEAD)'"
                  },
                  "buildCommand": "npm run build",
                  "outputDirectory": ".next",
                  "env": {
                    "DATABASE_URL": { "type": "encrypted", "value": "'$DATABASE_URL'" },
                    "DIRECT_URL": { "type": "encrypted", "value": "'$DIRECT_URL'" }
                  }
                }'
            else
              echo "CLI deploy failed with exit code $CLI_EXIT"
              exit $CLI_EXIT
            fi
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_2 }}
