name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Configure git
        run: |
          git config --global user.email "hangdivision@gmail.com"
          git config --global user.name "Hang"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          # Try CLI first
          CLI_OUTPUT=$(vercel --prod --yes --token $VERCEL_TOKEN 2>&1)
          CLI_EXIT=$?
          echo "$CLI_OUTPUT"

          if [ $CLI_EXIT -eq 0 ]; then
            echo "✅ CLI deploy succeeded"
          elif echo "$CLI_OUTPUT" | grep -q "api-deployments-free-per-day"; then
            echo "⚠️ Vercel CLI rate limited — falling back to REST API"
            # Fall back to Vercel REST API
            SHA=$(git rev-parse HEAD)
            curl -s -X POST "https://api.vercel.com/v13/deployments" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"portraitpay\",
                \"gitSource\": {
                  \"type\": \"github\",
                  \"repo\": \"Hd10011390276/portraitpay\",
                  \"ref\": \"main\",
                  \"sha\": \"$SHA\"
                },
                \"buildCommand\": \"npm run build\",
                \"outputDirectory\": \".next\",
                \"env\": {
                  \"DATABASE_URL\": { \"type\": \"encrypted\", \"value\": \"$DATABASE_URL\" },
                  \"DIRECT_URL\": { \"type\": \"encrypted\", \"value\": \"$DIRECT_URL\" }
                }
              }"
          else
            echo "❌ Deploy failed with exit code $CLI_EXIT"
            exit $CLI_EXIT
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_2 }}
