name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Configure git
        run: |
          git config --global user.email "hangdivision@gmail.com"
          git config --global user.name "Hang"

      # Vercel GitHub App handles deployment automatically on push to main
      # No need for manual vercel --prod command here